[package]
name = "spectrum-configurator"
version = "1.0.0"
description = "Configuration app for the Cosmic Byte Spectrum mouse"
authors = ["sohambb"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spectrum-configurator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
spectrum-protocol = { path = "../crates/spectrum-protocol" }

# Smaller debug builds (keeps file and line numbers in backtraces)
[profile.dev]
debug = "line-tables-only"

# Small, fast release build for the installer
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
